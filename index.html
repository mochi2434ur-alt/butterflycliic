<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<style>
  body{
    position:relative;
    margin:0;
  }

  /* 背景（君が自由にサイズ調整してOK） */
  #bg0{
    position:absolute;
    left:0;
    top:0;
    width:960px;   /* ← 君が自由に変更してOK */
    height:534px;  /* ← 君が自由に変更してOK */
  }

  /* 窓（背景の上に見える） */
  #bg1{
    position:absolute;
    left:0;
    top:0;
    width:960px;   /* ← 君が自由に変更してOK */
    height:534px;  /* ← 君が自由に変更してOK */
    z-index:2;     /* ← 青い生命体より後ろに見える */
  }

  /* 青い生命体（背景と窓に挟まれて見えるが、カーソルは当たる） */
  .foo{
    position:absolute;
    width:50px;    /* ← 君が自由に変更してOK */
    z-index:10;    /* ← これでカーソルが当たるようになる（見た目は挟まれたまま） */
    transition:left 0.8s, top 0.8s;
  }

  /* ちょうちょ（下半分でスライド移動） */
  .butterfly{
    position:absolute;
    width:100px;
    transition:left 0.8s, top 0.8s;
  }

  /* ピンク文字（君が自由に変更してOK） */
  #message{
    position:absolute;
    left:20px;
    top:30px;
    width:500px;     /* ← 君が自由に変更してOK */
    height:100px;    /* ← 君が自由に変更してOK */
    background-color:rgba(255,200,220,0.35);
    color:#ff66aa;
    font-size:24px;  /* ← 君が自由に変更してOK */
    font-weight:bold;
    line-height:1.4;
    padding:10px;
  }
</style>

</head>
<body>

<!-- 背景 -->
<img src="bg0.png" id="bg0">

<!-- 青い生命体（背景と窓に挟まれて見える） -->
<img src="foo.gif" class="foo" id="foo0" style="left:380px; top:210px;">
<img src="foo.gif" class="foo" id="foo1" style="left:420px; top:260px;">
<img src="foo.gif" class="foo" id="foo2" style="left:460px; top:230px;">
<img src="foo.gif" class="foo" id="foo3" style="left:500px; top:280px;">
<img src="foo.gif" class="foo" id="foo4" style="left:540px; top:220px;">

<!-- 窓 -->
<img src="bg1.png" id="bg1">

<!-- ちょうちょ -->
<img src="butterfly.gif" class="butterfly" id="bt0" style="left:300px; top:300px;">
<img src="butterfly.gif" class="butterfly" id="bt1" style="left:500px; top:350px;">
<img src="butterfly.gif" class="butterfly" id="bt2" style="left:100px; top:320px; width:150px;">

<!-- ピンク文字 -->
<div id="message">
  ぽかぽか陽気の穏やかな朝<br>
  花畑では、蝶々がのんびり飛んでいます
</div>

<script>
  /* 画面サイズ */
  const W = window.innerWidth;
  const H = window.innerHeight;

  /* ちょうちょは画面下半分だけで逃げる */
  const MIN_Y = H * 0.5;
  const MAX_Y = H * 0.9;

  document.querySelectorAll('.butterfly').forEach(el=>{
    el.addEventListener('mouseover', ()=>{
      const x = Math.random() * (W - 100);
      const y = MIN_Y + Math.random() * (MAX_Y - MIN_Y);
      el.style.left = x + 'px';
      el.style.top = y + 'px';
    });
  });

  /* 窓の範囲（青い生命体用） */
  const WIN_LEFT = 360;
  const WIN_RIGHT = 850;
  const WIN_TOP = 190;
  const WIN_BOTTOM = 320;

  /* 青い生命体は窓の中だけでスライド移動 */
  document.querySelectorAll('.foo').forEach(el=>{
    el.addEventListener('mouseover', ()=>{
      const x = WIN_LEFT + Math.random() * (WIN_RIGHT - WIN_LEFT - 50);
      const y = WIN_TOP + Math.random() * (WIN_BOTTOM - WIN_TOP - 50);
      el.style.left = x + 'px';
      el.style.top = y + 'px';
    });
  });
</script>

</body>
</html>

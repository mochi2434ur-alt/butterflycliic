<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>ぽかぽか陽気の朝</title>

  <style>
    body {
      margin: 0;
      background: #faf7f2;
      font-family: sans-serif;
    }

    .stage {
      position: relative;
      width: 960px;
      height: 534px;
    }

    .stage img, .text-box, .text {
      position: absolute;
    }

    /* 背景（後ろ） */
    #bg0 {
      left: 0;
      top: 0;
      width: 960px;
      height: 534px;
    }

    /* 青い生命体（背景と窓の間） */
    #foo {
      left: 400px;
      top: 230px;
      width: 120px;
      z-index: 2; /* bg0の上、bg1の下 */
    }

    /* 窓（前） */
    #bg1 {
      left: 0;
      top: 0;
      width: 960px;
      height: 534px;
      z-index: 3;
    }

    /* ちょうちょ（最前面） */
    .butterfly {
      width: 100px;
      z-index: 4;
    }

    #bt0 { left: 300px; top: 60px; }
    #bt1 { left: 500px; top: 400px; }
    #bt2 { left: 100px; top: 300px; width:150px; }

    /* 文字の背景枠（薄いピンク） */
    .text-box {
      top: 20px;
      left: 20px;
      width: 420px;
      height: 90px;
      background: rgba(255, 200, 220, 0.35);
      border-radius: 10px;
      z-index: 5;
    }

    /* ピンク文字 */
    .text {
      top: 32px;
      left: 35px;
      color: #ff66aa;
      font-size: 28px;
      font-weight: bold;
      line-height: 1.4;
      z-index: 6;
    }
  </style>
</head>

<body>
  <div class="stage">

    <!-- ① 背景 -->
    <img src="bg0.png" id="bg0">

    <!-- ② 青い生命体（背景と窓の間） -->
    <img src="foo.gif" id="foo">

    <!-- ③ 窓 -->
    <img src="bg1.png" id="bg1">

    <!-- ④ ちょうちょ3匹 -->
    <img src="butterfly.gif" class="butterfly" id="bt0">
    <img src="butterfly.gif" class="butterfly" id="bt1">
    <img src="butterfly.gif" class="butterfly" id="bt2">

    <!-- ⑤ 文字背景 -->
    <div class="text-box"></div>

    <!-- ⑥ ピンク文字 -->
    <div class="text">
      ぽかぽか陽気の穏やかな朝<br>
      花畑では、蝶々がのんびり飛んでいます
    </div>

  </div>

  <script>
    /* 画面サイズ */
    const W = 960;
    const H = 534;

    /* 窓の範囲（青い生命体用） */
    const WIN_LEFT = 360;
    const WIN_RIGHT = 850;
    const WIN_TOP = 190;
    const WIN_BOTTOM = 320;

    /* ちょうちょ：画面全体で逃げる */
    document.querySelectorAll('.butterfly').forEach(el => {
      el.addEventListener('mouseover', () => {
        const x = Math.random() * (W - 100);
        const y = Math.random() * (H - 100);
        el.style.left = x + 'px';
        el.style.top = y + 'px';
      });
    });

    /* 青い生命体：窓の中だけで逃げる */
    const foo = document.getElementById('foo');
    foo.addEventListener('mouseover', () => {
      const x = WIN_LEFT + Math.random() * (WIN_RIGHT - WIN_LEFT - 120);
      const y = WIN_TOP + Math.random() * (WIN_BOTTOM - WIN_TOP - 120);
      foo.style.left = x + 'px';
      foo.style.top = y + 'px';
    });
  </script>

</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>ぽかぽか陽気の朝</title>

  <style>
    body{
      position:relative;
      margin:0;
      background:#faf7f2;
    }

    /* ちょうちょ */
    .butterfly{
      width:100px;
      position:absolute;
      transition:left 0.8s, top 0.8s;
    }

    #bt0{ left:300px; top:300px; }
    #bt1{ left:500px; top:350px; }
    #bt2{ left:100px; top:320px; width:150px; }

    /* 青い生命体（背景と窓に挟まれたまま動く） */
    .foo{
      position:absolute;
      width:50px;   /* 君が調整してOK */
      z-index:10;   /* ← これだけでカーソルが当たるようになる */
      transition:left 0.8s, top 0.8s;
    }

    /* ピンク文字の枠（君が調整してOK） */
    #message{
      position:absolute;
      left:20px;
      top:30px;
      width:500px;
      height:100px;
      background-color:rgba(255,200,220,0.35);
      color:#ff66aa;
      font-size:24px;
      font-weight:bold;
      line-height:1.4;
      padding:10px;
    }
  </style>
</head>

<body>

  <div class="stage">

    <!-- 背景（君が調整してOK） -->
    <img src="bg0.png" id="bg0" style="position:absolute; left:0; top:0;">

    <!-- 青い生命体（背景と窓の間に見える） -->
    <img src="foo.gif" class="foo" id="foo0" style="left:380px; top:210px;">
    <img src="foo.gif" class="foo" id="foo1" style="left:420px; top:260px;">
    <img src="foo.gif" class="foo" id="foo2" style="left:460px; top:230px;">
    <img src="foo.gif" class="foo" id="foo3" style="left:500px; top:280px;">
    <img src="foo.gif" class="foo" id="foo4" style="left:540px; top:220px;">

    <!-- 窓（青い生命体より前に見える） -->
    <img src="bg1.png" id="bg1" style="position:absolute; left:0; top:0;">

    <!-- ちょうちょ -->
    <img src="butterfly.gif" class="butterfly" id="bt0">
    <img src="butterfly.gif" class="butterfly" id="bt1">
    <img src="butterfly.gif" class="butterfly" id="bt2">

    <!-- ピンク文字 -->
    <div id="message">
      ぽかぽか陽気の穏やかな朝<br>
      花畑では、蝶々がのんびり飛んでいます
    </div>

  </div>

  <script>
    /* 画面サイズ */
    const W = window.innerWidth;
    const H = window.innerHeight;

    /* ちょうちょは画面下半分だけで逃げる */
    const MIN_Y = H * 0.5;
    const MAX_Y = H * 0.9;

    document.querySelectorAll('.butterfly').forEach(el=>{
      el.addEventListener('mouseover', ()=>{
        const x = Math.random() * (W - 100);
        const y = MIN_Y + Math.random() * (MAX_Y - MIN_Y);
        el.style.left = x + 'px';
        el.style.top = y + 'px';
      });
    });

    /* 青い生命体は窓の中だけで逃げる */
    const WIN_LEFT = 360;
    const WIN_RIGHT = 850;
    const WIN_TOP = 190;
    const WIN_BOTTOM = 320;

    document.querySelectorAll('.foo').forEach(el=>{
      el.addEventListener('mouseover', ()=>{
        const x = WIN_LEFT + Math.random() * (WIN_RIGHT - WIN_LEFT - 50);
        const y = WIN_TOP + Math.random() * (WIN_BOTTOM - WIN_TOP - 50);
        el.style.left = x + 'px';
        el.style.top = y + 'px';
      });
    });
  </script>

</body>
</html>
